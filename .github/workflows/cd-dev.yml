name: CD — Development

on:
  push:
    branches: [dev]

jobs:
  deploy-dev:
    name: Deploy to DEV (AKS)
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.doctalk.ng
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Wait for Docker images to be pushed
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Build & Push Docker images"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group doctalk-rg --name doctalk-aks --overwrite-existing

      - name: Roll out new images
        run: |
          TAG="dev-${{ github.sha }}"
          kubectl set image deployment/api api=doctalkacr.azurecr.io/doctalk-api:$TAG -n doctalk
          kubectl set image deployment/web web=doctalkacr.azurecr.io/doctalk-web:$TAG -n doctalk

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n doctalk --timeout=5m
          kubectl rollout status deployment/web -n doctalk --timeout=5m

      - name: Post log out of Azure
        if: always()
        run: az logout
