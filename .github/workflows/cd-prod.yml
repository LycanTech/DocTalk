name: CD — Production

on:
  push:
    tags:
      - "v*.*.*"                # Semantic version tag triggers production deploy
  workflow_dispatch:             # Manual trigger with approval gate
    inputs:
      image_tag:
        description: "Docker image tag to deploy (e.g. staging-abc1234)"
        required: true

jobs:
  deploy-prod:
    name: Deploy to PRODUCTION
    runs-on: ubuntu-latest
    environment:
      name: production             # GitHub env with required reviewers configured
      url: https://doctalk.ng
    concurrency:
      group: deploy-prod
      cancel-in-progress: false   # Never cancel a prod deploy mid-flight

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production images
        if: github.event_name == 'push'
        run: |
          docker buildx build --push \
            -t ghcr.io/${{ github.repository_owner }}/doctalk-api:${{ env.IMAGE_TAG }} \
            -t ghcr.io/${{ github.repository_owner }}/doctalk-api:latest \
            -f apps/api/Dockerfile .
          docker buildx build --push \
            -t ghcr.io/${{ github.repository_owner }}/doctalk-web:${{ env.IMAGE_TAG }} \
            -t ghcr.io/${{ github.repository_owner }}/doctalk-web:latest \
            --build-arg NEXT_PUBLIC_API_URL=https://api.doctalk.ng \
            -f apps/web/Dockerfile .

      - name: Deploy to PRODUCTION (blue-green)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/doctalk
            # Blue-green: pull new images before stopping old containers
            export DOCKER_REGISTRY=ghcr.io/${{ github.repository_owner }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            export JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            export JWT_REFRESH_SECRET=${{ secrets.PROD_JWT_REFRESH_SECRET }}
            export CORS_ORIGINS=https://doctalk.ng
            export NEXT_PUBLIC_API_URL=https://api.doctalk.ng
            export ACME_EMAIL=${{ secrets.ACME_EMAIL }}
            docker compose -f infrastructure/docker/docker-compose.prod.yml pull
            docker compose -f infrastructure/docker/docker-compose.prod.yml up -d --remove-orphans
            # Wait for health checks
            sleep 30
            docker compose -f infrastructure/docker/docker-compose.prod.yml ps
            docker image prune -f

      - name: Production health check
        run: |
          sleep 15
          for i in {1..5}; do
            if curl -f https://doctalk.ng/health && curl -f https://api.doctalk.ng/health; then
              echo "Health checks passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health checks failed after 5 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/doctalk
            docker compose -f infrastructure/docker/docker-compose.prod.yml down
            export IMAGE_TAG=latest
            docker compose -f infrastructure/docker/docker-compose.prod.yml up -d
            echo "Rolled back to :latest"

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ env.IMAGE_TAG }}',
              name: 'Release ${{ env.IMAGE_TAG }}',
              body: 'Production deployment of DocTalk ${{ env.IMAGE_TAG }}',
              draft: false,
              prerelease: false
            })
