name: CD — Staging

on:
  push:
    branches: [staging]

jobs:
  deploy-staging:
    name: Deploy to STAGING (AKS)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.doctalk.ng
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: "Tests"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Set image tag
        id: tag
        run: echo "tag=staging-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push all images to ACR
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          ACR=${{ secrets.ACR_LOGIN_SERVER }}

          docker buildx build --push \
            -t $ACR/doctalk-gateway:$TAG \
            -f apps/gateway/Dockerfile .
          docker buildx build --push \
            -t $ACR/doctalk-auth:$TAG \
            -f apps/services/auth/Dockerfile .
          docker buildx build --push \
            -t $ACR/doctalk-patients:$TAG \
            -f apps/services/patients/Dockerfile .
          docker buildx build --push \
            -t $ACR/doctalk-records:$TAG \
            -f apps/services/records/Dockerfile .
          docker buildx build --push \
            -t $ACR/doctalk-appointments:$TAG \
            -f apps/services/appointments/Dockerfile .
          docker buildx build --push \
            -t $ACR/doctalk-notifications:$TAG \
            -f apps/services/notifications/Dockerfile .
          docker buildx build --push \
            -t $ACR/doctalk-web:$TAG \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.STAGING_API_URL }} \
            -f apps/web/Dockerfile .

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Set up kubectl + kustomize
        uses: azure/setup-kubectl@v4

      - name: Update image tags in overlay
        working-directory: infrastructure/k8s/overlays/staging
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          ACR=${{ secrets.ACR_LOGIN_SERVER }}

          kustomize edit set image \
            doctalk-gateway=$ACR/doctalk-gateway:$TAG \
            doctalk-auth=$ACR/doctalk-auth:$TAG \
            doctalk-patients=$ACR/doctalk-patients:$TAG \
            doctalk-records=$ACR/doctalk-records:$TAG \
            doctalk-appointments=$ACR/doctalk-appointments:$TAG \
            doctalk-notifications=$ACR/doctalk-notifications:$TAG \
            doctalk-web=$ACR/doctalk-web:$TAG

      - name: Apply staging K8s manifests
        run: kubectl apply -k infrastructure/k8s/overlays/staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-gateway   -n doctalk --timeout=180s
          kubectl rollout status deployment/web           -n doctalk --timeout=180s
          kubectl rollout status deployment/service-auth  -n doctalk --timeout=120s

      - name: Run smoke tests
        run: |
          sleep 20
          curl -f https://staging.doctalk.ng/health         || exit 1
          curl -f https://api.staging.doctalk.ng/health     || exit 1
          echo "Smoke tests passed"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ STAGING deployment failed. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            }).catch(() => {})
