name: Scheduled — Appointment Reminders

on:
  schedule:
    - cron: "0 18 * * *"   # 6 PM UTC daily (7 PM WAT)
  workflow_dispatch:         # Manual trigger for testing

jobs:
  send-reminders:
    name: Send appointment reminders
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger reminder broadcast
        run: |
          curl -f -X POST "${{ secrets.PROD_API_URL }}/api/v1/notifications/broadcast/appointments" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}" \
            -H "Content-Type: application/json"
