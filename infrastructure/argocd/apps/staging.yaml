apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doctalk-staging
  namespace: argocd
  labels:
    environment: staging
    project: doctalk
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: doctalk

  source:
    repoURL: https://github.com/LycanTech/DocTalkApp
    targetRevision: staging
    path: infrastructure/helm/doctalk
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: doctalk-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
