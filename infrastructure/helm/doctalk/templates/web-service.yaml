apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "doctalk.labels" . | nindent 4 }}
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
      protocol: TCP
