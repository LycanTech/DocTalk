apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: doctalk

resources:
  - ../../base

# Image tags are set by CI/CD at deploy time via:
#   kustomize edit set image doctalk-gateway=$ACR/doctalk-gateway:$TAG
# The newName here is the ACR login server prefix — update to match your ACR.
images:
  - name: doctalk-gateway
    newName: doctalkregistry.azurecr.io/doctalk-gateway
    newTag: latest
  - name: doctalk-auth
    newName: doctalkregistry.azurecr.io/doctalk-auth
    newTag: latest
  - name: doctalk-patients
    newName: doctalkregistry.azurecr.io/doctalk-patients
    newTag: latest
  - name: doctalk-records
    newName: doctalkregistry.azurecr.io/doctalk-records
    newTag: latest
  - name: doctalk-appointments
    newName: doctalkregistry.azurecr.io/doctalk-appointments
    newTag: latest
  - name: doctalk-notifications
    newName: doctalkregistry.azurecr.io/doctalk-notifications
    newTag: latest
  - name: doctalk-web
    newName: doctalkregistry.azurecr.io/doctalk-web
    newTag: latest

patches:
  # Staging-specific ingress: staging.doctalk.ng
  - patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.doctalk.ng
      - op: replace
        path: /spec/tls/0/hosts/1
        value: api.staging.doctalk.ng
      - op: replace
        path: /spec/tls/0/secretName
        value: doctalk-staging-tls
      - op: replace
        path: /spec/rules/0/host
        value: staging.doctalk.ng
      - op: replace
        path: /spec/rules/1/host
        value: api.staging.doctalk.ng
    target:
      kind: Ingress
      name: doctalk-ingress

  # Staging ConfigMap overrides
  - patch: |-
      - op: replace
        path: /data/CORS_ORIGINS
        value: https://staging.doctalk.ng
      - op: replace
        path: /data/APP_URL
        value: https://staging.doctalk.ng
      - op: replace
        path: /data/API_URL
        value: https://api.staging.doctalk.ng
    target:
      kind: ConfigMap
      name: doctalk-config
