apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doctalk-ingress
  namespace: doctalk
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - host: api.doctalk.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
    - host: doctalk.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
