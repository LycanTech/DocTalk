apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-appointments
  namespace: doctalk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-appointments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: service-appointments
    spec:
      containers:
        - name: service-appointments
          image: doctalk-appointments:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4014
          envFrom:
            - configMapRef:
                name: doctalk-config
            - secretRef:
                name: doctalk-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 4014
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4014
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: service-appointments
  namespace: doctalk
spec:
  selector:
    app: service-appointments
  ports:
    - port: 4014
      targetPort: 4014
  type: ClusterIP
